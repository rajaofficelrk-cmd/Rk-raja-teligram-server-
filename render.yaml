services:
  - type: web
    name: raja-telegram-panel
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --threads 4 --timeout 0 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5

      - key: SECRET_KEY
        generateValue: true

      - key: SESSION_DIR
        value: /opt/render/project/src/sessions
